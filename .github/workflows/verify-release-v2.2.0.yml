name: Verify and release ua-info 2.2.0

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/verify-release-v2.2.0.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ua-info-v2.2.0-release-verification
  cancel-in-progress: false

jobs:
  await-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Wait for npm registry propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if [ "$(npm view ua-info@2.2.0 version 2>/dev/null || true)" = "2.2.0" ]; then
              echo "ua-info@2.2.0 is available from the npm registry."
              exit 0
            fi
            echo "Registry attempt ${attempt}/60 did not resolve ua-info@2.2.0 yet."
            sleep 10
          done
          echo "ua-info@2.2.0 did not propagate within the verification window." >&2
          exit 1

  verify:
    needs: await-registry
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install clean package
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/ua-info-live-${{ matrix.node-version }}"
          rm -rf "$workspace"
          mkdir -p "$workspace"
          echo "WORKSPACE=$workspace" >> "$GITHUB_ENV"
          cd "$workspace"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --ignore-scripts --no-audit --no-fund ua-info@2.2.0 typescript@4.9.5

      - name: Verify ESM behavior and package contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          cat > verify.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import * as root from 'ua-info';
          import { parseRequest } from 'ua-info/server';
          import { detectCurrent } from 'ua-info/browser';

          for (const name of [
            'isBrowser',
            'isBrowserFamily',
            'isBrowserMode',
            'isEngine',
            'isOperatingSystem',
            'isDeviceType',
            'isCPUArchitecture',
            'isClientKind',
            'isContextKind',
          ]) assert.equal(typeof root[name], 'function', `${name} export`);

          const chromeUA =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36';
          const chrome = root.parse(chromeUA);
          assert.equal(root.isBrowser(chrome, root.BrowserId.Chrome), true);
          assert.equal(root.isBrowserFamily(chrome, 'chromium'), true);
          assert.equal(root.isBrowserMode(chrome, 'browser'), true);
          assert.equal(root.isEngine(chrome, 'blink'), true);
          assert.equal(root.isOperatingSystem(chrome, 'windows'), true);
          assert.equal(root.isDeviceType(chrome, 'desktop'), true);

          const iphone = root.parse(
            'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) ' +
            'AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1',
          );
          assert.equal(root.isCPUArchitecture(iphone, 'arm64'), true);

          const crawler = root.parse('OAI-SearchBot/1.0');
          assert.equal(root.isClientKind(crawler, 'crawler'), true);

          const line = root.parse('Line/26.11.0 LIFF');
          assert.equal(root.isContextKind(line, 'mini-app'), true);

          assert.equal(
            parseRequest({
              userAgent: '',
              headers: { 'sec-ch-ua': '"Google Chrome";v="150", "Microsoft Edge";v="150"' },
            }).browser?.id,
            root.BrowserId.Edge,
          );
          assert.equal(typeof detectCurrent, 'function');
          assert.equal('UAInfo' in root, false);

          const require = createRequire(import.meta.url);
          const manifest = require('ua-info/package.json');
          assert.equal(manifest.name, 'ua-info');
          assert.equal(manifest.version, '2.2.0');
          assert.equal(manifest.repository.url, 'git+https://github.com/petechatchawan/ua-info.git');
          assert.throws(() => require('ua-info/v2'), /Package subpath|not defined|cannot find/i);
          EOF
          node verify.mjs

      - name: Verify CommonJS behavior and package contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          cat > verify.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const root = require('ua-info');
          const { parseRequest } = require('ua-info/server');
          const { detectCurrent } = require('ua-info/browser');

          for (const name of [
            'isBrowser',
            'isBrowserFamily',
            'isBrowserMode',
            'isEngine',
            'isOperatingSystem',
            'isDeviceType',
            'isCPUArchitecture',
            'isClientKind',
            'isContextKind',
          ]) assert.equal(typeof root[name], 'function', `${name} export`);

          const result = root.parse(
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
          );
          assert.equal(root.isBrowser(result, root.BrowserId.Chrome), true);
          assert.equal(root.isBrowserFamily(result, 'chromium'), true);
          assert.equal(root.isBrowserMode(result, 'browser'), true);
          assert.equal(root.isEngine(result, 'blink'), true);
          assert.equal(root.isOperatingSystem(result, 'windows'), true);
          assert.equal(root.isDeviceType(result, 'desktop'), true);
          assert.equal(root.isCPUArchitecture(root.parse(
            'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 ' +
            '(KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1',
          ), 'arm64'), true);
          assert.equal(root.isClientKind(root.parse('OAI-AdsBot/1.0'), 'crawler'), true);
          assert.equal(root.isContextKind(root.parse('Line/26.11.0 LIFF'), 'mini-app'), true);
          assert.equal(
            parseRequest({ userAgent: '', headers: { 'sec-ch-ua': '"Microsoft Edge";v="150"' } }).browser?.id,
            root.BrowserId.Edge,
          );
          assert.equal(typeof detectCurrent, 'function');
          assert.equal('UAInfo' in root, false);
          assert.throws(() => require('ua-info/v2'), /Package subpath|not defined|cannot find/i);
          EOF
          node verify.cjs

      - name: Verify TypeScript Node16 narrowing
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          cat > verify.ts <<'EOF'
          import {
            BrowserId,
            isBrowser,
            isCPUArchitecture,
            isClientKind,
            isContextKind,
            parse,
          } from 'ua-info';
          import { parseRequest } from 'ua-info/server';
          import { detectCurrent } from 'ua-info/browser';

          const browser = parse(
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
          );
          if (isBrowser(browser, BrowserId.Chrome)) {
            const id: typeof BrowserId.Chrome = browser.browser.id;
            void id;
          }

          const iphone = parse(
            'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) ' +
            'AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1',
          );
          if (isCPUArchitecture(iphone, 'arm64')) {
            const architecture: 'arm64' = iphone.cpu.architecture;
            void architecture;
          }

          const crawler = parse('OAI-SearchBot/1.0');
          if (isClientKind(crawler, 'crawler')) {
            const kind: 'crawler' = crawler.client.kind;
            void kind;
          }

          const line = parse('Line/26.11.0 LIFF');
          if (isContextKind(line, 'mini-app')) {
            const kind: 'mini-app' = line.context.kind;
            void kind;
          }

          const requestResult = parseRequest({
            userAgent: '',
            headers: { 'sec-ch-ua': '"Microsoft Edge";v="150"' },
          });
          const detector: typeof detectCurrent = detectCurrent;
          void requestResult;
          void detector;
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "Node16",
              "moduleResolution": "Node16",
              "strict": true,
              "skipLibCheck": false,
              "noEmit": true,
              "lib": ["ES2020", "DOM"],
              "types": []
            },
            "include": ["verify.ts"]
          }
          EOF
          npx tsc --project tsconfig.json

      - name: Verify registry metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view ua-info@2.2.0 name)" = "ua-info"
          test "$(npm view ua-info@2.2.0 version)" = "2.2.0"
          test "$(npm view ua-info@2.2.0 repository.url)" = "git+https://github.com/petechatchawan/ua-info.git"
          test -z "$(npm view ua-info@2.2.0 deprecated 2>/dev/null || true)"

  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: 4dc6077140d54e2937b493fa88e81624ee51bf59
    steps:
      - name: Create or verify GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.2.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release v2.2.0 already exists."
          else
            cat > release-notes.md <<'EOF'
          ## ua-info 2.2.0

          Additive developer-experience release introducing nine pure, tree-shakeable typed predicate helpers.

          ### Highlights

          - Adds `isBrowser`, `isBrowserFamily`, `isBrowserMode`, `isEngine`, and `isOperatingSystem`.
          - Adds `isDeviceType`, `isCPUArchitecture`, `isClientKind`, and `isContextKind`.
          - Narrows nullable result dimensions and matched literal values in TypeScript.
          - Supports custom and future string IDs for extensible identity dimensions.
          - Retains ESM, CommonJS, TypeScript, server, browser, and Node.js 18/20/22 compatibility.
          - Makes no detector, `UAResult`, package entry-point, or runtime dependency changes.

          User-Agent and Client Hints values remain untrusted claims. Predicate matches do not authenticate identity or request origin.
          EOF
            gh release create v2.2.0 \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_COMMIT" \
              --title "ua-info v2.2.0" \
              --notes-file release-notes.md
          fi

          tag_target=$(gh api "repos/${{ github.repository }}/git/ref/tags/v2.2.0" --jq '.object.sha')
          test "$tag_target" = "$RELEASE_COMMIT"

  report:
    needs: [await-registry, verify, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Report live verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[live-verification] ua-info@2.2.0"
          if [ "${{ needs.await-registry.result }}" = "success" ] && \
             [ "${{ needs.verify.result }}" = "success" ] && \
             [ "${{ needs.release.result }}" = "success" ]; then
            status="passed"
          else
            status="failed"
          fi

          body=$(cat <<EOF
          Live npm registry and GitHub release verification.

          - Package: ua-info@2.2.0
          - Package release commit: 4dc6077140d54e2937b493fa88e81624ee51bf59
          - Matrix: Node.js 18, 20, 22
          - Result: **${status}**
          - Coverage: clean install, all nine predicate exports and representative runtime behavior, ESM, CommonJS, TypeScript Node16 narrowing, root, /server, /browser, package metadata, removed /v2 subpath, GitHub release tag target
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          issue_number=$(gh issue list --repo "${{ github.repository }}" --state all --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -z "$issue_number" ]; then
            issue_url=$(gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body")
            issue_number="${issue_url##*/}"
          else
            gh issue edit "$issue_number" --repo "${{ github.repository }}" --body "$body"
          fi

          if [ "$status" = "passed" ]; then
            gh issue close "$issue_number" --repo "${{ github.repository }}" --reason completed || true
          else
            gh issue reopen "$issue_number" --repo "${{ github.repository }}" || true
            exit 1
          fi
